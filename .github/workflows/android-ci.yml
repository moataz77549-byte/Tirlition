name: Android CI
on:
  push:
    branches: [ main, feature/rateel-foundation ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Compile instrumented tests
        run: gradle assembleDebugAndroidTest --stacktrace
      - name: Lint
        run: gradle lintDebug --stacktrace
      - name: Build debug
        run: gradle assembleDebug --stacktrace
      - name: Compile release sources
        run: gradle compileReleaseKotlin --stacktrace
      - name: Build unsigned release candidate
        run: gradle assembleRelease --stacktrace
      - name: Stage unsigned candidate and signing tools
        run: |
          mkdir -p signing-tools/lib
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$signer"
          cp "$signer" signing-tools/apksigner
          cp "$(dirname "$signer")/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          cp "$(dirname "$signer")/zipalign" signing-tools/zipalign
          chmod +x signing-tools/apksigner signing-tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: rateel-unsigned-candidate-and-tools
          path: |
            app/build/outputs/apk/release/*.apk
            signing-tools/
          if-no-files-found: error
          retention-days: 7
