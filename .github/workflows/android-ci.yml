name: Android CI
on:
  push:
    branches: [ main, feature/rateel-foundation ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Compile instrumented tests
        run: gradle assembleDebugAndroidTest --stacktrace
      - name: Lint
        run: gradle lintDebug --stacktrace
      - name: Build debug
        run: gradle assembleDebug --stacktrace
      - name: Compile release sources
        run: gradle compileReleaseKotlin --stacktrace
