name: Stage 1 verified bootstrap

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/stage1-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout bootstrap payload
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore and align Rateel source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/rateel-stage1.b64
          base64 --decode /tmp/rateel-stage1.b64 > /tmp/rateel-stage1.tar.gz
          git switch --orphan stage1-verified
          git rm -rf . || true
          tar -xzf /tmp/rateel-stage1.tar.gz -C .

          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f .github/workflows/android-ci.yml
          test -f gradle/libs.versions.toml

          # Stable AndroidX line compatible with compileSdk 36.
          sed -i 's/minSdk = 23/minSdk = 24/' app/build.gradle.kts
          sed -i 's/composeBom = "2026.09.00"/composeBom = "2026.06.00"/' gradle/libs.versions.toml
          sed -i 's/lifecycle = "2.11.0"/lifecycle = "2.10.0"/' gradle/libs.versions.toml
          sed -i 's/navigation = "2.10.2"/navigation = "2.9.8"/' gradle/libs.versions.toml
          sed -i 's/androidxHilt = "1.4.0"/androidxHilt = "1.3.0"/' gradle/libs.versions.toml
          sed -i 's/androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }/androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }/' gradle/libs.versions.toml
          sed -i 's/libs.androidx.hilt.navigation.compose/libs.androidx.hilt.lifecycle.viewmodel.compose/' app/build.gradle.kts
          grep -RIl 'androidx.hilt.navigation.compose.hiltViewModel' app/src/main/java | xargs -r sed -i 's/androidx.hilt.navigation.compose.hiltViewModel/androidx.hilt.lifecycle.viewmodel.compose.hiltViewModel/g'

          # CI uses the stable SDK already present on GitHub-hosted runners.
          sed -i '/android-actions\/setup-android@v3/d' .github/workflows/android-ci.yml
          sed -i 's#run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"#run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"#' .github/workflows/android-ci.yml
          sed -i 's/actions\/checkout@v4/actions\/checkout@v5/' .github/workflows/android-ci.yml
          sed -i 's/actions\/setup-java@v4/actions\/setup-java@v5/' .github/workflows/android-ci.yml

          # Architecture documentation must match the verified build baseline.
          sed -i 's/| `minSdk` | 23 | Broad compatibility and the current Hilt minimum. |/| `minSdk` | 24 | Modern AndroidX baseline while retaining Android 7.0+ compatibility. |/' README.md
          sed -i 's/- minSdk 23: current Hilt 2.60 has a minimum SDK of 23 and this still covers a broad device range./- minSdk 24: modern AndroidX baseline that retains Android 7.0+ compatibility without unsafe manifest overrides./' docs/ARCHITECTURE.md

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.6.0 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Pre-push secret audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(sb_secret_|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----)' . \
            --exclude-dir=.git --exclude-dir=.gradle --exclude-dir=build --exclude-dir=.github; then
            echo "Potential secret detected. Refusing to publish."
            exit 1
          fi
          if grep -R -n 'sb_publishable_KhCxa6BBOarfpUR3RYDjWw_tr9bnEsW' . \
            --exclude-dir=.git --exclude-dir=.gradle --exclude-dir=build; then
            echo "Provided Supabase key was accidentally included in source."
            exit 1
          fi

      - name: Test, lint, and build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          find app/schemas -type f -name '*.json' -print
          test "$(find app/schemas -type f -name '*.json' | wc -l)" -ge 1

      - name: Publish verified logical commits
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .gitignore app build.gradle.kts gradle.properties gradle settings.gradle.kts
          git reset -- app/src/test
          git commit -m "feat: establish Rateel Android foundation"
          git push --force origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"

          git add app/src/test .github/workflows/android-ci.yml
          git commit -m "test: add foundation verification and Android CI"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"

          git add README.md docs
          git commit -m "docs: document Rateel architecture"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"

          test -z "$(git status --porcelain)"
          git log --oneline --decorate -5
